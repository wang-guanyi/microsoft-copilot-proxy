[project]
name = "microsoft-copilot-proxy"
version = "0.1.0"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.0,<1.0.0",
    "httpx>=0.28.0,<1.0.0",
    "playwright>=1.63.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "requests>=2.34.2",
    "uvicorn>=0.35.0,<1.0.0",
    "websockets>=12.0,<15.0",
]


[project.scripts]
microsoft-copilot-proxy = "microsoft_copilot_proxy.cli:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/microsoft_copilot_proxy"]
